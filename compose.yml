services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: oauth2
      POSTGRES_USER: oauth2
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth2 -d oauth2"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
